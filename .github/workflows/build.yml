# SPDX-License-Identifier: GPL-3.0-or-later
# Builds and tests the bundle on Windows, macOS and Linux. Pushing a tag such as v1.1.0
# also publishes a GitHub release with a ready-made zip for each platform.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            cmake_args: ""
          - name: macos-universal
            os: macos-15
            cmake_args: -DLILV_CHECK=ON "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          - name: linux-x86_64
            os: ubuntu-22.04
            cmake_args: -DLILV_CHECK=ON
          - name: linux-arm64
            os: ubuntu-22.04-arm
            cmake_args: -DLILV_CHECK=ON
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev xvfb liblilv-0-0

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install lilv

      - name: Configure
        shell: bash
        run: cmake -B out -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build out --config Release

      - name: Test
        if: runner.os != 'Linux'
        run: ctest --test-dir out -C Release --output-on-failure

      - name: Test (with a virtual X display)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x1024x24" ctest --test-dir out -C Release --output-on-failure

      - name: Test the Intel half of the macOS build (Rosetta)
        if: runner.os == 'macOS'
        env:
          NO_CPU_LIMIT: "1" # emulated timing says nothing about real Intel Macs
        run: |
          lipo -info out/lv2/canary-plus.lv2/canary-plus.dylib out/lv2/canary-plus.lv2/canary-plus_ui.dylib
          arch -x86_64 out/test_dsp out/lv2/canary-plus.lv2

      - name: Package
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version="dev"; fi
          zip="canary-plus-${version}-${{ matrix.name }}.zip"
          cd out/lv2
          cmake -E tar cf "../../$zip" --format=zip canary-plus.lv2
          cd ../..
          cmake -E echo "Packaged $zip"

      - uses: actions/upload-artifact@v5
        with:
          name: canary-plus-${{ matrix.name }}
          path: canary-plus-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          Ready-made bundles of Davidian Canary Plus ${version}. Each zip holds one \`canary-plus.lv2\` folder: copy it into your LV2 folder (see the README's Install section).

          | Download | For |
          |---|---|
          | \`canary-plus-${version}-windows-x64.zip\` | Windows 10 and 11, 64-bit |
          | \`canary-plus-${version}-macos-universal.zip\` | macOS 10.13 or later, Intel and Apple Silicon |
          | \`canary-plus-${version}-linux-x86_64.zip\` | Linux on 64-bit Intel and AMD (glibc 2.35 or later) |
          | \`canary-plus-${version}-linux-arm64.zip\` | Linux on 64-bit ARM (glibc 2.35 or later) |

          Every bundle was built and tested by this repository's CI. Licensed under GPL-3.0-or-later; the source for each build is this tag. Written with AI assistance: code generated by Claude (Anthropic), directed and tested by the author.
          EOF
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Davidian Canary Plus ${version}" --notes-file notes.md
