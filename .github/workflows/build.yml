# SPDX-License-Identifier: GPL-3.0-or-later
# Builds and tests every version on Windows, macOS and Linux: LV2 everywhere, VST3 on
# Windows, Audio Unit on macOS. Pushing a tag such as v1.2.0 also publishes a GitHub
# release with ready-made zips.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            cmake_args: ""
          - name: macos-universal
            os: macos-15
            cmake_args: -DLILV_CHECK=ON "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          - name: linux-x86_64
            os: ubuntu-22.04
            cmake_args: -DLILV_CHECK=ON
          - name: linux-arm64
            os: ubuntu-22.04-arm
            cmake_args: -DLILV_CHECK=ON
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev xvfb liblilv-0-0

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install lilv

      - name: Configure
        shell: bash
        run: cmake -B out -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build out --config Release

      - name: Test
        if: runner.os != 'Linux'
        run: ctest --test-dir out -C Release --output-on-failure

      - name: Test (with a virtual X display)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x1024x24" ctest --test-dir out -C Release --output-on-failure

      - name: Test the Intel half of the macOS build (Rosetta)
        if: runner.os == 'macOS'
        env:
          NO_CPU_LIMIT: "1" # emulated timing says nothing about real Intel Macs
        run: |
          lipo -info out/lv2/canary-plus.lv2/canary-plus.dylib out/lv2/canary-plus.lv2/canary-plus_ui.dylib \
                     out/au/canary-plus.component/Contents/MacOS/canary-plus
          otool -l out/au/canary-plus.component/Contents/MacOS/canary-plus | grep -A3 LC_BUILD_VERSION | grep minos
          arch -x86_64 out/test_dsp out/lv2/canary-plus.lv2
          arch -x86_64 out/src/au/au_check out/au/canary-plus.component

      - name: Validate the Audio Unit with auval
        if: runner.os == 'macOS'
        run: |
          codesign --verify --strict --verbose out/au/canary-plus.component
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R out/au/canary-plus.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -a | grep -i "Dvdn" || (sleep 5; auval -a | grep -i "Dvdn")
          auval -strict -v aufx Cnry Dvdn
          arch -x86_64 auval -strict -v aufx Cnry Dvdn

      - name: Package
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version="dev"; fi
          pack() { # pack <folder containing it> <bundle> <format>
            zip="canary-plus-${version}-${{ matrix.name }}-$3.zip"
            (cd "$1" && cmake -E tar cf "$GITHUB_WORKSPACE/$zip" --format=zip "$2")
            echo "Packaged $zip"
          }
          pack out/lv2 canary-plus.lv2 lv2
          if [[ -d out/vst3/canary-plus.vst3 ]]; then pack out/vst3 canary-plus.vst3 vst3; fi
          if [[ -d out/au/canary-plus.component ]]; then pack out/au canary-plus.component au; fi

      - uses: actions/upload-artifact@v5
        with:
          name: canary-plus-${{ matrix.name }}
          path: canary-plus-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat > notes.md <<NOTES
          Ready-made bundles of Davidian Canary Plus ${version}. Each zip holds one plugin bundle: copy it into your plugin folder (see the README's Install section).

          | Download | Format | For |
          |---|---|---|
          | \`canary-plus-${version}-windows-x64-vst3.zip\` | VST3 | Windows 10 and 11, 64-bit |
          | \`canary-plus-${version}-windows-x64-lv2.zip\` | LV2 | Windows 10 and 11, 64-bit |
          | \`canary-plus-${version}-macos-universal-au.zip\` | Audio Unit | macOS 11 or later, Intel and Apple Silicon |
          | \`canary-plus-${version}-macos-universal-lv2.zip\` | LV2 | macOS 10.13 or later, Intel and Apple Silicon |
          | \`canary-plus-${version}-linux-x86_64-lv2.zip\` | LV2 | Linux on 64-bit Intel and AMD (glibc 2.35 or later) |
          | \`canary-plus-${version}-linux-arm64-lv2.zip\` | LV2 | Linux on 64-bit ARM (glibc 2.35 or later) |

          All three formats share the same circuit model and panel. Every bundle was built and tested by this repository's CI, including Steinberg's VST3 validator and Apple's auval. Licensed under GPL-3.0-or-later; the source for each build is this tag. The VST3 version includes code from the VST3 SDK (MIT licence) and the Audio Unit from Apple's AudioUnitSDK (Apache-2.0 licence); their licences are inside the bundles. Written with AI assistance: code generated by Claude (Anthropic), directed and tested by the author.
          NOTES
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Davidian Canary Plus ${version}" --notes-file notes.md
